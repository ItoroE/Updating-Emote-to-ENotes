<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emotes to E-Notes</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 520px;
      margin: 2em auto;
      padding: 0 16px;
    }
    label {
      display: block;
      margin: 1em 0;
    }
    input[type=range] {
      width: 100%;
    }
    button {
      padding: .5em 1em;
      margin-right: .5em;
    }
    .note, #info {
      font-size: .9em;
      color: #555;
    }
    #emote {
      font-size: 1.5em;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h2>Emotes to E-Notes</h2>
  <p class="note">Test only: outputs one clip. Use the <a href="/">camera page</a> for live generation.</p>

  <div id="emote">Neutral</div>

  <label>
    Valence: <b id="vv">0</b>
    <input id="v" type="range" min="-1" max="1" step="0.05" value="0">
  </label>
  <label>
    Arousal: <b id="av">0</b>
    <input id="a" type="range" min="-1" max="1" step="0.05" value="0">
  </label>

  <button onclick="go('/generate?valence='+v.value+'&arousal='+a.value)">Generate</button>
  <button onclick="go('/from_emotion')">Use last emote reading</button>

  <p id="info"></p>
  <audio id="player" controls></audio>

  <script src="/pages/single.js"></script>
</body>
</html>
